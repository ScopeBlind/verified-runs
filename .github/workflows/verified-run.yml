# A verified run in CI, with provenance.
#
# Runs one agent over a task set (the sealed set by default) with every tool
# call through protect-mcp under the policy compiled from the signed standard,
# checks the result as a reader would, and attests the three files with
# GitHub's build provenance: `gh attestation verify manifest.json --owner scopeblind`.
#
# Needs: OPENAI_API_KEY (for --agent codex) or CLAUDE_CODE_OAUTH_TOKEN (for
# --agent claude), and SEALED_TASKS_KEY to open the sealed set. Manual
# dispatch only; nothing runs on push except the checks.
name: verified-run
on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'codex, claude, or attested (a minimal loop on an attested inference route; needs NEARAI_CLOUD_API_KEY)'
        default: codex
      tasks:
        description: 'comma-separated Terminal-Bench task ids, or sealed:<path>'
        default: sealed:task-sets/terminal-bench-4.sealed.json
      model:
        description: 'model name for the agent'
        default: gpt-5.5
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest==8.4.1
      - run: npm ci
      - name: Install the agent
        run: |
          if [ "${{ inputs.agent }}" = "codex" ]; then npm i -g @openai/codex && codex --version; else npm i -g @anthropic-ai/claude-code && claude --version; fi
      - name: Sign the agent in with the API key
        if: ${{ inputs.agent == 'codex' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Pasted secrets carry stray whitespace more often than not; a key is never whitespace.
        run: printf '%s' "$OPENAI_API_KEY" | tr -d '[:space:]' | codex login --with-api-key
      - name: Install the sandbox Claude Code uses on Linux
        if: ${{ inputs.agent == 'claude' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
      - name: Describe the Claude token (shape only, never the value)
        if: ${{ inputs.agent == 'claude' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          t="$CLAUDE_CODE_OAUTH_TOKEN"
          echo "length ${#t}; starts with ${t:0:11}; ends with a newline: $([ "${t: -1}" = $'\n' ] && echo yes || echo no); contains whitespace: $(printf '%s' "$t" | grep -q '[[:space:]]' && echo yes || echo no)"
      - name: Let the agent's sandbox create its namespaces
        # Ubuntu 24.04 confines unprivileged user namespaces under AppArmor, which
        # denies the sandbox the capability it needs to bring up loopback. The
        # sandbox itself is unchanged.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verified run
        env:
          CLAUDE_CODE_OAUTH_TOKEN_RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NEARAI_CLOUD_API_KEY: ${{ secrets.NEARAI_CLOUD_API_KEY }}
          SEALED_TASKS_KEY: ${{ secrets.SEALED_TASKS_KEY }}
          GH_TOKEN: ${{ github.token }}
          LEGATE_ATTEST: github-actions-provenance
        run: |
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN_RAW" | tr -d '[:space:]')"
          # A run made here is public: the calls log and the workspace archives are published with it, so the
          # second grading below (and anyone else) can rebuild the workspaces. Hold them by running the harness
          # on your own machine with --no-disclose-calls --no-disclose-workspace.
          node harness/verified-run.mjs --agent "${{ inputs.agent }}" --tasks "${{ inputs.tasks }}" --model "${{ inputs.model }}" --out "$RUNNER_TEMP/verified-run" --disclose-calls --disclose-workspace
      - name: Check the run as a reader would
        run: npx @veritasacta/verify "$RUNNER_TEMP/verified-run/manifest.json" --standard "$RUNNER_TEMP/verified-run/standard.json" --receipts "$RUNNER_TEMP/verified-run/receipts.jsonl" --calls "$RUNNER_TEMP/verified-run/calls.jsonl"
      - name: Attest provenance of the manifest, the receipt chain, and the standard
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/verified-run/manifest.json
            ${{ runner.temp }}/verified-run/receipts.jsonl
            ${{ runner.temp }}/verified-run/standard.json
      - name: Keep the attestation bundles beside the run, so they can be checked offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-run/provenance" && cd "$RUNNER_TEMP/verified-run/provenance"
          # The standard is deterministic, so its digest carries one attestation per run that used it; keep this run's.
          keep_this_run() { node -e 'const fs=require("fs");const [f,run]=process.argv.slice(1);const keep=fs.readFileSync(f,"utf8").split("\n").filter(Boolean).filter((l)=>{try{const s=JSON.parse(Buffer.from(JSON.parse(l).dsseEnvelope.payload,"base64").toString("utf8"));return String(s.predicate?.runDetails?.metadata?.invocationId||"").includes("/runs/"+run+"/");}catch{return false;}});if(!keep.length)throw new Error("no attestation from this run in "+f);fs.writeFileSync(f,keep.join("\n")+"\n");' "$1" "$GITHUB_RUN_ID"; }
          for f in manifest.json receipts.jsonl standard.json; do
            gh attestation download "../$f" -R "$GITHUB_REPOSITORY" && mv sha256:*.jsonl "$f.sigstore.jsonl" && keep_this_run "$f.sigstore.jsonl"
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: verified-run
          path: ${{ runner.temp }}/verified-run

  # A second grading in a separate job: the archived workspaces are rebuilt, the pinned tests are obtained
  # again and checked against the pin, pytest runs again, and the verdicts are signed under the grader key.
  regrade:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest==8.4.1
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-run
          path: ${{ runner.temp }}/verified-run
      - name: Second grading
        env:
          SEALED_TASKS_KEY: ${{ secrets.SEALED_TASKS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tasks='${{ inputs.tasks }}'
          case "$tasks" in
            sealed:*) node harness/regrade.mjs --run "$RUNNER_TEMP/verified-run" --sealed "${tasks#sealed:}" --sign ;;
            *)        node harness/regrade.mjs --run "$RUNNER_TEMP/verified-run" --sign ;;
          esac
      - name: Attest provenance of the second grading
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/verified-run/regrade.json
      - name: Keep the attestation bundle beside it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/verified-run/provenance" && gh attestation download ../regrade.json -R "$GITHUB_REPOSITORY" && mv sha256:*.jsonl regrade.json.sigstore.jsonl
          node -e 'const fs=require("fs");const [f,run]=process.argv.slice(1);const keep=fs.readFileSync(f,"utf8").split("\n").filter(Boolean).filter((l)=>{try{const s=JSON.parse(Buffer.from(JSON.parse(l).dsseEnvelope.payload,"base64").toString("utf8"));return String(s.predicate?.runDetails?.metadata?.invocationId||"").includes("/runs/"+run+"/");}catch{return false;}});if(!keep.length)throw new Error("no attestation from this run in "+f);fs.writeFileSync(f,keep.join("\n")+"\n");' regrade.json.sigstore.jsonl "$GITHUB_RUN_ID" && ls -la
      - name: Read the run with the published verifier, provenance included
        run: npx @veritasacta/verify "$RUNNER_TEMP/verified-run/manifest.json" --standard "$RUNNER_TEMP/verified-run/standard.json" --receipts "$RUNNER_TEMP/verified-run/receipts.jsonl" --calls "$RUNNER_TEMP/verified-run/calls.jsonl" --regrade "$RUNNER_TEMP/verified-run/regrade.json" --provenance "$RUNNER_TEMP/verified-run/provenance"
      - name: Check the whole run as a reader would, second grading included
        run: |
          mkdir -p "$RUNNER_TEMP/runs" && cp -R "$RUNNER_TEMP/verified-run" "$RUNNER_TEMP/runs/"
          node harness/check-verified-run.mjs "$RUNNER_TEMP/runs"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-run-regraded
          path: ${{ runner.temp }}/verified-run
